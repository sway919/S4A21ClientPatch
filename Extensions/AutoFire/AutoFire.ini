[General]
; 插件启动时是否默认启用：1=启用，0=停用。
Enabled=1
; 连发总开关。按一次关闭，再按一次重新启用。默认 Page Up。
ToggleKey=PGUP
; 修改本文件后按此键重新读取配置，不需要重启客户端。默认 Page Down。
ReloadKey=PGDN
; 1=仅在当前 DNF 进程位于前台时工作，建议保持为 1。
ForegroundOnly=1
; 1=写入 AutoFire.log，确认插件是否加载、是否在合成按键。默认 0。
Debug=0
; 每次合成按下后保持多久再弹起。战斗按帧读键，1 毫秒容易被漏掉，默认 16。
KeyPressDurationMs=16
; 第一下走物理键。按住超过该毫秒才开始连发。允许 0 到 1000。默认 0。
; 不影响游戏内聊天、搜索、起名等输入。
HoldThresholdMs=0

; 普通键盘连发：每行格式为“物理按键=连发周期毫秒”。按住时改 DirectInput 键表。
; 支持字母、数字、F1-F24、方向键、左右 Ctrl/Shift/Alt、数字小键盘和扫描码。
[RapidFire]
; 按住 X 时自动连发 X。周期允许 1 到 1000，实际最短按 10 毫秒。
; 也可把键名写成 SC24，扩展扫描码写成 SCE04D。
X=1

; 组合按键最多支持 [Combo0] 到 [Combo15]，每一节都按下方格式独立配置。
[Combo0]
; 本组合的独立开关：1=启用，0=关闭。缺少或填写无效值时也按关闭处理。
; 修改后按 PGDN 重载；关闭本组合不会影响其他组合、普通连发或鼠标连点。
Enabled=0
; 本组合的物理触发键。按下后立刻执行一轮；短按松开后，已经开始的一轮仍会执行完整。
Trigger=A
; 是否在按住 Trigger 时重复整套动作：1=持续重复，0=每次物理按下只执行一轮。
Repeat=1
; 动作列表格式为“按键:该键弹起后的等待毫秒数”，各项用英文逗号分隔，最多 64 项。
; A:1,S:1 表示发送 A 后等待 1 毫秒，再发送 S 后等待 1 毫秒；按键保持时间由 KeyPressDurationMs 控制。
Actions=A:1,S:1

; 鼠标连点使用独立开关、物理触发键和目标鼠标键。
[Mouse]
; 鼠标连点开关：1=启用，0=关闭。总开关在 [General] ToggleKey。
Enabled=1
; 按住什么物理键开始连点（需按住超过 HoldThresholdMs）。默认中键。
; 可填 LCtrl、Space、F8 等键盘键，也可填鼠标键：
; LButton=左键，RButton=右键，MButton=中键，XButton1/XButton2=两个侧键。
Trigger=MButton
; 自动重复点击的目标鼠标键，可填 Left、Right、Middle、XButton1、XButton2。
; Trigger 使用 LButton/RButton 等物理键名；Button 使用 Left/Right 等目标键名，两者不要混写。
Button=Left
; 每次鼠标按下后保持多久再弹起，单位为毫秒，允许 1 到 1000。
; DNF 可能按画面帧轮询鼠标状态；默认 16，漏判时改为 20。
PressDurationMs=16
; 鼠标弹起后等待多久再开始下一次按下，单位为毫秒，允许 1 到 1000。
; 一轮约为 PressDurationMs + IntervalMs；当前 16+10 约为每秒 40 次。
IntervalMs=10
