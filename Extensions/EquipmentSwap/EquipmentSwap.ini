[General]
; 插件总开关：1=启用换装插件，0=关闭插件。默认关闭；修改后必须完全退出并重新启动游戏。
; 关闭时不会安装原生窗口工厂分流、注册快捷键、读取角色数据或发送任何换装请求。
Enabled=1
; 1=写入 EquipmentSwap.log。
Debug=0
; 打开或关闭游戏内原生换装窗口的快捷键。默认 End。
; 支持 Ctrl、Alt、Shift、Win 与一个普通按键；也可以填写 F1-F24、Space、Enter、Tab、Esc、Insert、Delete、方向键等名称。
; 填写 None 或 无表示不注册窗口快捷键。
; 六套方案的快捷键以及装备、时装、宠物穿戴记录均在游戏内窗口中配置，并按角色 ID 保存到 EquipmentSwap\Data\<角色ID>.mq。
; 方案只要设置了快捷键并且读取了至少一件穿戴内容就会自动生效，不需要额外开关。
WindowHotkey=End
